<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redactar</title>
</head>
<body>
    <h2>Nuevo Correo - TurboMessage</h2>
    <p>Usuario: {{ username }}</p>

    <p>
        <a href="{% url 'mailapp:inbox' %}">Bandeja de Entrada</a> |
        <a href="{% url 'mailapp:outbox' %}">Bandeja de Salida</a> |
        <a href="{% url 'mailapp:logout' %}">Cerrar Sesion</a>
    </p>

    {% if error %}
        <p>{{ error }}</p>
    {% endif %}

    {% if success %}
        <p>{{ success }}</p>
    {% endif %}

    <form action="" method="POST">
        {% csrf_token %}
        <label>Destino: <input type="text" name="receiver"></label><br><br>
        <label>Asunto: <input type="text" name="subject"></label><br><br>
        <label>Mensaje:</label><br>
        <textarea name="message" rows="8" cols="50"></textarea><br><br>
        <input type="submit" value="Enviar">
    </form>
</body>
</html>
