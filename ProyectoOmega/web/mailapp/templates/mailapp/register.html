<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro</title>
</head>
<body>
    <h2>Registro - TurboMessage</h2>

    {% if error %}
        <p>{{ error }}</p>
    {% endif %}

    {% if success %}
        <p>{{ success }}</p>
    {% endif %}

    <form action="" method="POST">
        {% csrf_token %}
        <label>Usuario alfanumerico: <input type="text" name="username"></label><br><br>
        <label>Contrasena: <input type="password" name="password"></label><br><br>
        <input type="submit" value="Registrar">
    </form>

    <p><a href="{% url 'mailapp:login' %}">Volver al inicio</a></p>
</body>
</html>
